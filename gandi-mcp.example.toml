#
# Example configuration for gandi-mcp. Copy it to gandi-mcp.toml (never committed)
# and pass it with: gandi-mcp --config gandi-mcp.toml
# Secrets (Gandi Personal Access Tokens) never go in this file: they are stored
# in the operating system keyring.

[logging]
# One of DEBUG, INFO, WARNING, ERROR, CRITICAL. Default: WARNING.
level = "WARNING"
