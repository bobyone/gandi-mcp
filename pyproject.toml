[project]
name = "gandi-mcp"
version = "0.1.0.dev0"
description = "Personal MCP server and MCP App for the Gandi public API"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSES/*.txt"]
authors = [{ name = "bobyone" }]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Name Service (DNS)",
  "Typing :: Typed",
]
dependencies = [
  "babel>=2.19,<3",
  "dependency-injector>=4.49,<5",
  "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/bobyone/gandi-mcp"
Issues = "https://github.com/bobyone/gandi-mcp/issues"
Changelog = "https://github.com/bobyone/gandi-mcp/blob/main/CHANGELOG.md"

[project.scripts]
gandi-mcp = "gandi_mcp.main:main"

[dependency-groups]
dev = [
  "mypy>=2.4,<3",
  "pip-audit>=2.10,<3",
  "pip-licenses>=5.5,<6",
  "pre-commit>=4.7,<5",
  "pytest>=9.2,<10",
  "pytest-cov>=7.1,<8",
  "respx>=0.23,<1",
  "reuse>=6.3,<7",
  "ruff>=0.17,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gandi_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT", "ANN", "T20", "LOG", "G"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ANN401"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = ["src", "."]
files = ["src", "tests", "scripts", "tools"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["dependency_injector.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["gandi_mcp", "scripts", "tools"]
omit = ["*/gandi_mcp/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
